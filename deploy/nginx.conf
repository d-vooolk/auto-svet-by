# ------------------------------------------------------------------
# nginx для auto-svet.by
#
# Положить в /etc/nginx/sites-available/auto-svet.by и включить:
#   sudo ln -s /etc/nginx/sites-available/auto-svet.by /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификат:  sudo certbot --nginx -d auto-svet.by -d www.auto-svet.by
# Certbot сам допишет секцию listen 443 и пути к сертификатам.
# ------------------------------------------------------------------

# Сжатие. Для HTML, CSS, JS и JSON это самый заметный по эффекту пункт всего
# конфига: страница каталога сжимается примерно в пять раз.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/xml
  application/javascript
  application/json
  application/xml
  application/rss+xml
  image/svg+xml;

# Если в сборке nginx есть модуль brotli — раскомментируйте, он сжимает
# текст ещё на 15–20% лучше gzip. Проверить: nginx -V 2>&1 | grep brotli
# brotli on;
# brotli_comp_level 5;
# brotli_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name auto-svet.by www.auto-svet.by;

    # Статический экспорт Next.js: обычные файлы на диске.
    root /var/www/auto-svet.by/current;
    index index.html;

    charset utf-8;

    # ---------------------------------------------------------------
    # Безопасность
    # ---------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Сайт не обращается ни к одному внешнему домену: шрифты, картинки и
    # скрипты свои. Поэтому политику можно закрутить жёстко.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ---------------------------------------------------------------
    # Приём заказов
    # ---------------------------------------------------------------
    location = /api/order {
        proxy_pass http://127.0.0.1:8787/api/order;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;

        # Если сервис заказов лёг, отдаём 502 сразу, не заставляя клиента
        # ждать. Сайт покажет текст заказа для пересылки вручную.
        proxy_next_upstream off;
    }

    # ---------------------------------------------------------------
    # Кеширование
    # ---------------------------------------------------------------

    # Файлы сборки Next и картинки из препроцессора содержат хеш или размер в
    # имени: при изменении меняется имя файла. Значит их можно кешировать
    # навсегда — повторные визиты не делают ни одного запроса за ними.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /img/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # HTML кешировать надолго нельзя: после правки цен в JSON и деплоя
    # клиент должен увидеть новую цену сразу.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Прайс и индекс поиска меняются с каждым деплоем — держим их свежими.
    location ~* ^/(variants|search-index)\.json$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
    }

    # ---------------------------------------------------------------
    # Роутинг
    # ---------------------------------------------------------------

    # В next.config.ts включён trailingSlash, поэтому /catalog/lampy/ лежит
    # на диске как /catalog/lampy/index.html — nginx находит его сам.
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Мусорные запросы к следам других CMS — не пишем в лог и не тратим время.
    location ~* /(wp-admin|wp-login|xmlrpc\.php|\.env|\.git) {
        access_log off;
        return 404;
    }

    client_max_body_size 1m;
}
